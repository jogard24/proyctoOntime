<div id="vistaRegistro" class="contenedor-formulario-modular">
    <section class="contenedor-form">
        <form class="formulario" enctype="multipart/form-data">
            <h1 class="titulo-formulario titulo-general">FORMULARIO DE REGISTRO</h1>
            <input type="hidden" name="estado" value="activo">

            <div class="form-group mb-3 text-center">
                <div class="contenedor-preview mb-2">
                    <img id="vistaPrevia" src="img/usuario-defecto.png" alt="Vista previa">
                </div>
                <input type="file" id="fotoInput" name="fotoPerfil" accept="image/png, image/jpeg, image/jpg"
                    class="form-control">
            </div>

            <div class="datos-principales">
                <div class="input-login">
                    <input class="label-modificador" type="text" name="nombre" id="nombre" placeholder=" " pattern="[A-Za-z\s]+" title="Solo se permiten letras" required>
                    <label for="nombre" class="label-flotante">Nombre</label>
                </div>
                <div class="input-login">
                    <input class="label-modificador" type="text" name="apellido" id="apellido" placeholder=" " required>
                    <label for="apellido" class="label-flotante">Apellido</label>
                </div>
                <div class="input-login">
                    <input class="label-modificador" type="tel" name="documento_identidad" id="documento_identidad" maxlength="10" pattern="\d{10}" title="Debe tener 10 números"
                        placeholder=" " required>
                    <label for="documento_identidad" class="label-flotante">Cédula</label>
                </div>
                <div class="input-login">
                    <input class="label-modificador" type="email" name="email" id="email" placeholder=" " required>
                    <label for="email" class="label-flotante">Email</label>
                </div>
                <div class="input-login">
                    <input class="label-modificador" type="tel" name="celular" id="celular" maxlength="10" pattern="\d{10}" title="Debe tener 10 números" placeholder=" "  required>
                    <label for="celular" class="label-flotante">Celular</label>
                </div>
                <div class="input-login">
                    <input class="label-modificador" type="text" name="direccion" id="direccion" placeholder=" "
                        required>
                    <label for="direccion" class="label-flotante">Dirección</label>
                </div>

                <!-- Ajuste 2: Select controlado para el tipo de sangre (Evita errores de ENUM en MySQL) -->
                <div class="input-login">
                    <select class="label-modificador" name="tipoSangre" id="tipoSangre" required
                        style="width: 100%; padding: 10px; background: transparent; border: 1px solid #ccc; border-radius: 4px;">
                        <option value="" disabled selected hidden>Seleccione tipo de sangre</option>
                        <option value="a+">A+</option>
                        <option value="a-">A-</option>
                        <option value="b+">B+</option>
                        <option value="b-">B-</option>
                        <option value="o+">O+</option>
                        <option value="o-">O-</option>
                        <option value="ab+">AB+</option>
                        <option value="ab-">AB-</option>
                    </select>
                </div>
            </div>

            <div class="info-emergencia">
                <h2 class="titulo-info-emergencia">Información de emergencia</h2>
                <div class="input-login">
                    <input class="label-modificador" type="text" name="nombreContacto" id="nombreContacto"
                        placeholder=" " required>
                    <label for="nombreContacto" class="label-flotante">Nombre del contacto</label>
                </div>
                <div class="input-login">
                    <input class="label-modificador" type="tel" name="celularContacto" id="celularContacto"
                        placeholder=" " maxlength="10" pattern="\d{10}" title="Debe tener 10 números" required>
                    <label for="celularContacto" class="label-flotante">Celular del contacto</label>
                </div>
                <div class="input-login">
                    <input class="label-modificador" type="text" name="relacionContacto" id="relacionContacto"
                        placeholder=" " required>
                    <label for="relacionContacto" class="label-flotante">Parentesco</label>
                </div>
                <div class="botones-accion">
                    <button type="button" class="bt-menu-item" id="btn-add-contrato">Agregar contrato</button>
                    <button type="button" class="bt-menu-item" id="btn-guardar-empleado">Guardar</button>
                </div>
            </div>
        </form>
    </section>
</div>

<!-- Modal para agregar contrato -->
<div id="modalContrato" class="modal"
    style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index: 1000;">
    <div class="modal-contenido"
        style="background: white; padding:20px; max-width:600px; width:100%; border-radius:6px;">
        <h3>Agregar contrato</h3>
        <form id="formContrato">
            <div class="input-login">
                <input class="label-modificador" type="text" name="tipoContrato" id="tipoContrato" placeholder=" "
                    required>
                <label for="tipoContrato" class="label-flotante">Tipo de contrato</label>
            </div>
            <div class="input-login">
                <input class="label-modificador" type="text" name="cargoContrato" id="cargoContrato" placeholder=" "
                    required>
                <label for="cargoContrato" class="label-flotante">Cargo</label>
            </div>
            <div class="input-login">
                <input class="label-modificador" type="number" step="0.01" name="salarioBase" id="salarioBase"
                    placeholder=" " required>
                <label for="salarioBase" class="label-flotante">Salario base</label>
            </div>


            <div class="input-login">
                <input class="label-modificador" type="number" min="1" name="jornadaContrato" id="jornadaContrato"
                    placeholder=" " required>
                <label for="jornadaContrato" class="label-flotante">ID Jornada Laboral</label>
            </div>

            <!-- <div class="input-login">
                <input class="label-modificador" type="date" name="fechaInicio" id="fechaInicio" placeholder=" " required>
                <label for="fechaInicio" class="label-flotante">Fecha inicio</label>
            </div>
            <div class="input-login">
                <input class="label-modificador" type="date" name="fechaFin" id="fechaFin" placeholder=" " required>
                <label for="fechaFin" class="label-flotante">Fecha fin</label>
            </div> -->

            <!-- Calendario 1: Fecha de Inicio -->
            <div style="display:flex; flex-direction:column; margin-bottom: 12px; font-family: inherit;">
                <span style="font-weight:bold; margin-bottom: 4px; color: #333; text-align: left;">Fecha de
                    Inicio:</span>
                <input type="date" id="regFechaInicio"
                    style="padding:8px; border:1px solid #ccc; border-radius:4px; font-family: inherit;" required>
            </div>

            <!-- Calendario 2: Fecha de Finalización (Opcional) -->
            <div style="display:flex; flex-direction:column; margin-bottom: 12px; font-family: inherit;">
                <span style="font-weight:bold; margin-bottom: 4px; color: #333; text-align: left;">Fecha de Vencimiento
                    (Dejar vacío si es Indefinido):</span>
                <input type="date" id="regFechaFin"
                    style="padding:8px; border:1px solid #ccc; border-radius:4px; font-family: inherit;">
            </div>
            <div class="input-login">
                <textarea name="observacionContrato" id="observacionContrato" rows="3"
                    placeholder="Observaciones (opcional)"
                    style="width: 100%; margin-top: 10px; padding: 8px; border-radius: 4px; border: 1px solid #ccc;"></textarea>
            </div>
            <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:12px;">
                <button type="button" id="btnCerrarModal" class="bt-menu-item">Cancelar</button>
                <button type="submit" id="btnGuardarContrato" class="bt-menu-item">Guardar contrato</button>
            </div>
        </form>
    </div>
</div>
