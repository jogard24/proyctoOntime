<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/dashb.css" />
    <link rel="stylesheet" href="../css/gestionempleados.css" />
    <link rel="stylesheet" href="../css/asistenciaTabla.css" />
    <link rel="stylesheet" href="../css/permisos.css" />
    <link rel="stylesheet" href="../css/inicioDashboard.css" />
    <title>Dashboard - OnTime</title>
  </head>

  <body>
    <section class="dash">
      <!-- Contenedor Menú Lateral -->
      <section class="contenedor-menu">
        <aside class="menu-lateral">
          <!-- Foto Perfil / Identificador Corporativo -->
          <div class="editar-perfil">
            <div class="avatar-perfil">
              <img id="visualizar" src="../img/logo sinfondo.png" alt="Logo Corporativo" />                
            </div>
          </div>
          
          <!-- Botones de Navegación del Menú Lateral -->
          <nav class="menu">
            <button class="bt-home bt-menu-item" id="btn-home">🏛️ ​ HOME</button>
            <button type="button" class="bt-menu-item" id="btn-gestionEmpleados">Gestión empleados</button>
            <button type="button" class="bt-menu-item" id="btn-Registro">Registro</button>
            <button type="button" class="bt-menu-item" id="btn-Asistencia">Asistencia</button>
            <button type="button" class="bt-menu-item" id="btn-Permisos">Permisos</button>
            <button type="button" class="bt-menu-item" id="btn-generarNomina">Nómina</button>
            <button type="button" class="bt-menu-item" id="btn-horario">Horario</button>
            
            <button type="button" class="bt-menu-item btn-Modificador-cerrar" id="btn-CerrarSesion" style="margin-top: auto;">
              Cerrar sesión
            </button>
          </nav>
        </aside>
      </section>
      
      <!-- Contenedor de Carga Dinámica de Vistas Modulares -->
      <div class="contenedor-dash" id="contenedor-dinamico">
         <!-- Aquí JavaScript inyectará el Home, la Gestión, el Registro, etc. -->
      </div>
    </section>

    <!-- El Modal de Edición se conserva limpio y se controlará de forma estricta mediante eventos en gestionEmpleados.js -->
    <div id="modalEditar" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
      <div style="background:white; width:min(90vw, 560px); padding:24px; border-radius:12px; box-shadow:0 24px 48px rgba(0,0,0,0.25);">
          <h2 style="margin-top:0; font-size:1.45rem; color:#333;">Editar Empleado</h2>
          <input type="hidden" id="editId">
          
          <div style="display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; margin-bottom:12px;">
            <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
              <label style="font-weight:bold;">Nombre Completo:</label>
              <input type="text" id="editNombre" style="padding:6px; border:1px solid #ccc; border-radius:4px;">
              
              <!-- Sincronizado con la columna cargo de tu BD Ontime3BD -->
              <label style="font-weight:bold; margin-top:6px;">Cargo Laboral:</label>
              <input type="text" id="editCargo" style="padding:6px; border:1px solid #ccc; border-radius:4px;">
              
              <label style="font-weight:bold; margin-top:6px;">Estado Administrativo:</label>
              <select id="editEstado" style="padding:6px; border:1px solid #ccc; border-radius:4px;">
                <option value="activo">Activo</option>
                <option value="inactivo">Inactivo</option>
              </select>
            </div>
          </div>
          
          <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:15px;">
            <button id="btn-cancelar-edicion" class="bt-menu-item" style="padding:8px 12px; border-radius:6px; border:1px solid #ccc; background:#fff;">Cancelar</button>
            <button id="btn-guardar-edicion" class="bt-menu-item" style="padding:8px 12px; border-radius:6px; background:#1565c0; color:#fff; border:none; font-weight:bold;">Guardar Cambios</button>
          </div>
      </div>
    </div>

    <!-- Orquestador central de módulos -->
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
