<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/dashb.css" />
    <link rel="stylesheet" href="../css/gestionempleados.css" />
    <link rel="stylesheet" href="../css/asistenciaTabla.css" />
    <link rel="stylesheet" href="../css/permisos.css" />
    <link rel="stylesheet" href="../css/inicioDashboard.css" />
    <title>dashb</title>
  </head>

  <body>
    <section class="dash">
      <!-- conetenedor menu lateral -->
      <section class="contenedor-menu">
        <aside class="menu-lateral">
          <!-- foto perfil -->
          <div class="editar-perfil">
            <form id="form-foto" enctype="multipart/form-data">
              <div class="avatar-perfil">
                <img
                  id="visualizar"
                  src="../img/logo sinfondo.png"
                  alt="vista-previa"
                />                
              </div>
       
            </form>
          </div>
          <!-- botones menu lateral -->
          <nav class="menu">
            <button class="bt-home bt-menu-item" id="btn-home">🏛️ ​ HOME</button>
            <button
              type="button"
              class="bt-menu-item"
              id="btn-gestionEmpleados"
            >
              Gestion empleados
            </button>
            <button type="button" class="bt-menu-item" id="btn-Registro">
              ​Registro
            </button>
            <button type="button" class="bt-menu-item" id="btn-Asistencia">
              Asistencia
            </button>
            <button type="button" class="bt-menu-item" id="btn-Permisos">
              Permisos
            </button>
            <button type="button" class="bt-menu-item" id="btn-generarNomina">
              Nomina
            </button>
            <button type="button" class="bt-menu-item" id="btn-Informes">
              Informes
            </button>
            <button type="button" class="bt-menu-item" id="btn-calendario">
              Calendario
            </button>

            <button type="button" class="bt-menu-item btn-Modificador-cerrar" id="btn-CerrarSesion">
              Cerrar sesión
            </button>



          </nav>
        </aside>
      </section>
      <!-- contenedor dashboard -->
      <div class="contenedor-dash" id="contenedor-dinamico">




        </section>
      </div>

    </section>

    <div id="modalEditar" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000;">
    <div style="background:white; width:400px; margin:100px auto; padding:20px; border-radius:8px;">
        <h2>Editar Empleado</h2>
        <input type="hidden" id="editId">
        <label>Nombre:</label><br>
        <input type="text" id="editNombre"><br>
        <label>Cargo:</label><br>
        <input type="text" id="editCargo"><br>
        <label>Estado:</label><br>
        <select id="editEstado">
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
        </select><br><br>
        
        <button onclick="guardarEdicion()">Guardar Cambios</button>
        <button onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>

    <script type="module" src="../js/main.js"></script>

  </body>
</html>
