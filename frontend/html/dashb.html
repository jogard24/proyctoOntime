<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/dashb.css" />
  <link rel="stylesheet" href="../css/gestionempleados.css" />
  <link rel="stylesheet" href="../css/asistenciaTabla.css" />
  <link rel="stylesheet" href="../css/permiso.css" />
  <link rel="stylesheet" href="../css/inicioDashboard.css" />
  <title>Dashboard - OnTime</title>
</head>

<body>
  <section class="dash">
    <!-- Contenedor Menú Lateral -->
    <section class="contenedor-menu">
      <aside class="menu-lateral">
        <!-- Foto Perfil / Identificador Corporativo -->
        <div class="editar-perfil">
          <div class="avatar-perfil">
            <img id="visualizar" src="../img/logo sinfondo.png" alt="Logo Corporativo" />
          </div>
        </div>

        <!-- Botones de Navegación del Menú Lateral -->
        <nav class="menu">
          <button class="bt-home bt-menu-item" id="btn-home">🏛️ ​ HOME</button>
          <button type="button" class="bt-menu-item" id="btn-gestionEmpleados">Gestión empleados</button>
          <button type="button" class="bt-menu-item" id="btn-Registro">Registro</button>
          <button type="button" class="bt-menu-item" id="btn-Asistencia">Asistencia</button>
          <button type="button" class="bt-menu-item" id="btn-Permiso">Permiso</button>
          <button type="button" class="bt-menu-item" id="btn-generarNomina">Nómina</button>
          <button type="button" class="bt-menu-item" id="btn-horario">Horario</button>

          <button type="button" class="bt-menu-item btn-Modificador-cerrar" id="btn-CerrarSesion"
            style="margin-top: auto;">
            Cerrar sesión
          </button>
        </nav>
      </aside>
    </section>

    <!-- Contenedor de Carga Dinámica de Vistas Modulares -->
    <div class="contenedor-dash" id="contenedor-dinamico">
      <!-- Aquí JavaScript inyectará el Home, la Gestión, el Registro, etc. -->
    </div>
  </section>

  <!-- El Modal de Edición se conserva limpio y se controlará de forma estricta mediante eventos en gestionEmpleados.js -->
  <div id="modalEditar"
    style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div
      style="background:white; width:min(90vw, 560px); padding:24px; border-radius:12px; box-shadow:0 24px 48px rgba(0,0,0,0.25); color: #333;">
      <h2 style="margin-top:0; font-size:1.45rem;">Editar Información del Empleado</h2>
      <input type="hidden" id="editId">

      <div style="display:flex; flex-direction:column; gap:12px; margin-top:15px;">
        <label style="font-weight:bold; display:flex; flex-direction:column;">
          Nombre :
          <input type="text" id="editNombre" style="padding:6px; border:1px solid #ccc; border-radius:4px;" required>
        </label>

        <label style="font-weight:bold; display:flex; flex-direction:column;">
          Celular:
          <input type="number" id="editCelular" style="padding:6px; border:1px solid #ccc; border-radius:4px;" required>
        </label>

        <label style="font-weight:bold; display:flex; flex-direction:column;">
          Dirección:
          <input type="text" id="editDireccion" style="padding:6px; border:1px solid #ccc; border-radius:4px;" required>
        </label>


        <label style="font-weight:bold; display:flex; flex-direction:column;">
          Asignar Cargo / Rol:
          <select id="editCargo" style="padding:6px; border:1px solid #ccc; border-radius:4px; background-color: white;"
            required>
            <option value="2">Empleado</option>
            <option value="1">Administrador</option>
            <option value="3">Contador</option>
          </select>
        </label>


        <label style="font-weight:bold; display:flex; flex-direction:column;">
          Estado del Empleado:
          <select id="editEstado" style="padding:6px; border:1px solid #ccc; border-radius:4px;">
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
          </select>
        </label>
      </div>

      <div id="contenedorCredencialesContador"
        style="display: none; flex-direction: column; gap: 12px; margin-top: 10px; padding: 12px; background: #f8f9fa; border: 1px dashed #1565c0; border-radius: 6px;">
        <h4
          style="margin: 0; font-size: 0.95rem; color: #1565c0; border-bottom: 1px solid #1565c0; padding-bottom: 4px;">
          Seguridad de Acceso Web (Rol: Contador)</h4>

        <label style="font-weight:bold; display:flex; flex-direction:column; font-size: 0.9rem;">
          Usuario de Acceso:
          <input type="text" id="editUsuarioContador" placeholder="Ej: contadorJose"
            style="padding:6px; border:1px solid #ccc; border-radius:4px; margin-top: 4px;">
        </label>

        <label style="font-weight:bold; display:flex; flex-direction:column; font-size: 0.9rem;">
          Contraseña de Acceso:
          <input type="password" id="editClaveContador" placeholder="Mínimo 6 caracteres"
            style="padding:6px; border:1px solid #ccc; border-radius:4px; margin-top: 4px;">
        </label>
      </div>


      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:20px;">
        <button id="btn-cancelar-edicion" class="bt-menu-item"
          style="padding:8px 12px; border-radius:6px; border:1px solid #1565c0; background:#1565c0; cursor:pointer;">Cancelar</button>
        <button id="btn-guardar-edicion" class="bt-menu-item"
          style="padding:8px 12px; border-radius:6px; background:#1565c0; color:#fff; border:none; font-weight:bold; cursor:pointer;">Guardar
          Cambios</button>
      </div>
    </div>
  </div>

  <!-- Orquestador central de módulos -->
  <script type="module" src="../js/main.js"></script>
</body>

</html>
