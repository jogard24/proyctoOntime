<div class="contenedorNomina animar-entrada">
    <div class="busquedaNomina">
        <h2 class="tituloNomina titulo-general"> Nómina</h2>
        
        <!-- Ajuste 2: Se añaden filtros de periodo consistentes con las nuevas tablas de Ontime3BD -->
        <div class="input-login" style="display: flex; gap: 10px; align-items: center; width: 100%; flex-wrap: wrap;">
            <input type="text" id="busqueda-empleado-nomina" placeholder="Buscar por nombre o cédula..." class="input-busqueda" style="flex: 1; min-width: 200px;">
            <input type="month" id="filtro-periodo-nomina" class="input-fecha" value="2026-06">
            <button class="bt-menu-item" id="btn-nomina">Buscar</button>
        </div>
    </div>
    
    <div class="tablaNomina-scroll">
        <table class="tablaNomina tabla-ontime">
            <thead>
                <tr>
                    <th>Cédula</th>
                    <th>Nombre</th>
                    <th>Salario Base</th>
                    <th>Deducciones</th>
                    <th>Dias</th>
                    <th>Extras</th>
                    <th>Salario Neto</th>
                </tr>
            </thead>
            <tbody>
                <!-- Se poblará dinámicamente con JavaScript -->
            </tbody>
        </table>
    </div>
    
    <div class="btn-contnomina">
        <button class="bt-menu-item" id="btn-cerrarNomina">Cerrar y Guardar Periodo</button>
        <button class="bt-menu-item" id="btn-exportarNomina">Descargar Informe</button>
    </div>
</div>
<link rel="stylesheet" href="./../css/nomina.css">
