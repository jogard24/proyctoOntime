<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <title>ontime</title>
</head>

<body>

    <div class="contenedor-login">

        <section class="card-logo">
            <img class="img-logo" src="../img/logosinfondo.png" alt=".">

            <div class="selector-rol" id="role-selector" >
                <h3>Selecciona tu perfil</h3>
                <button class="btn-role bt-admin" >Administrador</button>
                <button class="btn-role bt-contador" >Contador</button>

                <form id="login-form" style="display: none;">
                    <input type="text" id="user" placeholder="Usuario">
                    <input type="password" id="pass" placeholder="Contraseña">
                </form>
            </div>


        </section>

        <section class="card-login">

            <div class="input-login">
                <input class="labelModificador" type="text" name="nombre" placeholder=" " required>
                <label for="nombre" class="label-flotante">👷Usuario</label>
            </div>

            <div class="input-login">
                <input class="labelModificador" type="password" name="contraseña" id="pass" placeholder=" " required>
                <label for="contraseña" class="label-flotante"> 🔒Contraseña</label>
            </div>

            <div class="bt-login">
                <button id="btn-ingresar" class="bt-empleado bt-menu-item" type="button">INGRESAR</button>
            </div>



        </section>


    </div>
    <script src="../js/modulos/login.js"></script>
</body>

</html>
