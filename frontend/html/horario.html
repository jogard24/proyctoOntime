<link rel="stylesheet" href="../css/horario.css">
<div class="horario">
  <div class="panel-horario">
    <div class="panel-header">
      <h2>Configuración de horarios</h2>
      <div class="header-actions">
        <button class="btn-menu-item btn-horario" id="btn-nuevo-horario">Nuevo horario</button>
      </div>
    </div>

    <table class="tabla-ontime">
      <thead>
        <tr>
          <th>ID Jornada</th>
          <th>Nombre de Jornada</th>
          <th>Hora Entrada</th>
          <th>Hora Salida</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-horario-body">
        <tr class="empty-row">
          <td colspan="5">Cargando horarios...</td>
        </tr>
      </tbody>
    </table>
  </div>

   <!-- El modal ahora cuenta con z-index en CSS o estilos fijos básicos para simular el comportamiento -->
  <div id="modalHorario" class="modal-oculto" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:1000;">
    <div class="modal-dialog" style="background: white; padding:20px; max-width:400px; width:100%; border-radius:6px;">
      <h3 id="tituloModalHorario" class="modal-title">Editar horario</h3>
      
      <div class="horario-form" style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
        
        <!--  CAMBIO 1: El ID ahora se oculta o se bloquea porque el Backend lo generará automáticamente en MySQL -->
        <input id="horarioId" type="hidden" value="0">

        <!--  CAMBIO 2: ¡LIBERADO! Se eliminó el select fijo y se cambió por una caja de texto libre -->
        <label style="display: flex; flex-direction: column; font-weight: bold;">
          Nombre del Turno / Jornada (Ej: Turno Tarde, Oficina, Rotativo)
          <input id="horarioNombreJornada" type="text" placeholder="Escriba el nombre del nuevo horario..." class="horario-input" style="padding: 6px; border: 1px solid #ccc; border-radius: 4px;" required>
        </label>

        <label style="display: flex; flex-direction: column; font-weight: bold;">
          Hora de entrada
          <input id="horarioEntrada" type="time" class="horario-input" style="padding: 6px; border: 1px solid #ccc; border-radius: 4px;" required>
        </label>
        
        <label style="display: flex; flex-direction: column; font-weight: bold;">
          Hora de salida
          <input id="horarioSalida" type="time" class="horario-input" style="padding: 6px; border: 1px solid #ccc; border-radius: 4px;" required>
        </label>
      </div>

      <div class="form-actions" style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 15px;">
        <button id="btn-cancelar-horario" class="btn-menu-item btn-secondary">Cancelar</button>
        <button id="btn-guardar-horario" class="btn-menu-item btn-primary">Guardar horario</button>
      </div>
    </div>
  </div>
