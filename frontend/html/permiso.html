<div class="permiso">
  <div class="panel-permiso">
    <div class="panel-header">
      <h2>Control de permisos</h2>
      <button class="btn-menu-item btn-permiso" id="btn-nueva-solicitud">Nueva solicitud</button>
    </div>
    <table class="tabla-ontime">
      <thead>
        <tr>
          <th>Empleado</th>
          <th>Tipo de permiso</th>
          <th>Fecha de solicitud</th>
          <th>Desde</th>
          <th>Hasta</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>John Doe</td>
          <td>Vacaciones</td>
          <td>2023-10-01</td>
          <td>2023-10-05</td>
          <td>2023-10-10</td>
          <td><span class="status-pill yellow">Pendiente</span></td>
          <td>
            <div class="acciones-flex">
              <button class="btn-menu-item bt-ejecucion-editar" id="Editar">✔
              </button>
              <button class="btn-menu-item bt-ejecucion-eliminar" id="Eliminar">✘
              </button>
            </div>
          </td>
        </tr>
      </tbody>

    </table>
  </div>

</div>
<!--  MODAL FLOTANTE PARA SOLICITAR NUEVO PERMISO LABORAL -->
<div id="modalNuevoPermiso" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; font-family: sans-serif;">
    <div style="background: #ffffff; padding: 25px; border-radius: 8px; width: 360px; box-shadow: 0 4px 15px rgba(0,0,0,0.25); display: flex; flex-direction: column; gap: 12px;">
        <div style="border-bottom: 1px solid #dee2e6; padding-bottom: 8px; margin-bottom: 5px;">
            <h3 style="margin: 0; color: #1e3d59; font-size: 15px; font-weight: bold;"> Radicación de Novedad Laboral</h3>
            <p style="margin: 4px 0 0 0; color: #666; font-size: 11.5px;">Diligencie los datos para la aprobación del permiso.</p>
        </div>

        <!-- Caja: Cédula -->
        <div style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 12px; font-weight: bold; color: #495057;">Cédula del Colaborador:</label>
            <input type="text" id="permisoDocumento" placeholder="Ej: 109876543" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; width: 100%; box-sizing: border-box;">
        </div>

        <!-- Caja: Tipo de Novedad -->
        <div style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 12px; font-weight: bold; color: #495057;">Tipo de Permiso / Licencia:</label>
            <input type="text" id="permisoTipo" placeholder="Ej: Médico, Calamidad, Vacaciones" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; width: 100%; box-sizing: border-box;">
        </div>

        <!-- Caja: Fecha de Inicio -->
        <div style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 12px; font-weight: bold; color: #495057;">Fecha de Inicio:</label>
            <input type="date" id="permisoFechaInicio" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; width: 100%; box-sizing: border-box;">
        </div>

        <!-- Caja: Fecha de Finalización -->
        <div style="display: flex; flex-direction: column; gap: 4px;">
            <label style="font-size: 12px; font-weight: bold; color: #495057;">Fecha de Finalización:</label>
            <input type="date" id="permisoFechaFin" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; width: 100%; box-sizing: border-box;">
        </div>

        <!-- Botonera de Control Visual -->
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button id="btnCancelarPermiso" style="flex: 1; padding: 9px; background: #6c757d; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12.5px;">Cancelar</button>
            <button id="btnConfirmarPermiso" style="flex: 1; padding: 9px; background: #1e3d59; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12.5px;">Enviar a MySQL</button>
        </div>
    </div>
</div>
